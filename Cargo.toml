[workspace]
resolver = "3"
members = ["crates/megaquarry-core", "crates/megaquarry-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
megaquarry-core = { path = "crates/megaquarry-core" }
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
thiserror = "2"
rand = "0.8"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
indicatif = "0.18"
rpassword = "7"
dirs = "6"
assert_cmd = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
tokio-util = "0.7"
num-bigint = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }

# Hash-heavy code (hashcash, MAC) is unusably slow without optimization.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
